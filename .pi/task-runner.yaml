# ═══════════════════════════════════════════════════════════════════════
# Task Runner Configuration — sero
# ═══════════════════════════════════════════════════════════════════════
#
# Sero is an Electron + React agent-first desktop workspace for macOS.
# Monorepo: apps/desktop (Electron host) + packages/pi-* (federated apps).
# This file configures the /task command (task-runner extension).

# ── Task Areas ────────────────────────────────────────────────────────
# Single area for now. Split into domain areas (e.g. shell, apps, agent)
# when the task backlog grows large enough to warrant it.

task_areas:
  general:
    path: "taskplane-tasks"
    prefix: "SERO"
    context: "taskplane-tasks/CONTEXT.md"

# ── Reference Docs ────────────────────────────────────────────────────
# Tier 3 docs that tasks can reference in "Context to Read First".
# Only list docs workers actually need — less is better.

reference_docs:
  agents-md:
    path: "AGENTS.md"
    description: "Monorepo structure, conventions, banned patterns, critical rules"

  architecture:
    path: "docs/architecture.md"
    description: "Shell layout, component hierarchy, state management"

  decisions:
    path: "docs/decisions.md"
    description: "Numbered architecture decisions (AD-001+) with rationale"

  apps-tutorial:
    path: "docs/apps-tutorial.md"
    description: "Step-by-step guide to building new Sero apps (packages/pi-*)"

  sero-vision:
    path: "docs/sero.md"
    description: "Vision, platform constraints, Pi SDK philosophy"

  memory:
    path: "docs/memory.md"
    description: "Memory system architecture, tools, context injection"

  container:
    path: "docs/libs/container.md"
    description: "Apple Container CLI reference + ghost container protocol"

  plugins-guide:
    path: "docs/plugins-guide.md"
    description: "Creating, distributing, and installing Sero plugins"

  plugins-technical:
    path: "docs/plugins-technical.md"
    description: "Plugin system internals (architecture, IPC, file layout)"

  themes:
    path: "docs/themes/README.md"
    description: "Theming and style guide"

  node-pty:
    path: "docs/node-pty-setup.md"
    description: "node-pty native module rebuild guide"

  state-folders:
    path: "docs/state-and-folders-analysis.md"
    description: "Config/state locations and rationale"

  subagents:
    path: "docs/subagents.md"
    description: "Subagent design and orchestration"

  profiles:
    path: "docs/profiles.md"
    description: "Profile system architecture"

  security-hardening:
    path: "docs/security/hardening-plan.md"
    description: "Security hardening plan and progress"

# ── Standards ─────────────────────────────────────────────────────────
# Coding standards and rules. Agents follow these during implementation.

standards:
  file-size:
    description: "No source file may exceed 500 LOC. Split into utils/, sub-components, types.ts."

  no-local-storage:
    description: "Never use localStorage or sessionStorage. Use Zustand stores + filesystem-backed layout via persistLayout()."

  no-use-effect:
    description: "Avoid useEffect. Prefer Zustand store actions, subscriptions, or derived state. useEffect only for external sources (DOM events, IPC, timers)."

  top-level-imports:
    description: "Always use top-level imports. No inline import('...') type expressions. No unnecessary dynamic await import('...')."

  no-ts-ignore:
    description: "No @ts-ignore or @ts-expect-error unless no other fix exists — leave a comment explaining why."

  typecheck-before-commit:
    description: "Run 'pnpm typecheck' from monorepo root. All packages must pass with zero errors."

  conventional-commits:
    description: "Use Conventional Commit-style messages for all git commits."

  ipc-four-layers:
    description: "All UI↔agent data passes through 4 layers (React → Zustand → preload → main handler). All layers must be updated together."

  debounce-helper:
    description: "Use useDebouncedCallback/createDebouncedFn from src/hooks/useDebouncedCallback.ts, not hand-rolled setTimeout."

  tool-bridging:
    description: "Extension tools use pi.registerTool() and are bridged via sero-cli (AD-020). Never use customTools in createAgentSession()."

  agent-directory:
    description: "Sero uses ~/.sero-ui/agent/ (not ~/.pi/agent/). Paths set via PI_CODING_AGENT_DIR in electron/env.ts."

# ── Testing ───────────────────────────────────────────────────────────
# Commands that agents run to verify their work.

testing:
  commands:
    typecheck: "pnpm typecheck"
    build: "pnpm build"
    test: "cd apps/desktop && npx vitest run"
    typecheck-desktop: "cd apps/desktop && npx tsc --noEmit && npx tsc -p tsconfig.electron.json --noEmit"

# ── Self-Documentation Targets ────────────────────────────────────────
# Where agents log discoveries during task execution.

self_doc_targets:
  technical_debt: "taskplane-tasks/CONTEXT.md"
  architecture_decisions: "docs/decisions.md"

# ── Protected Docs ────────────────────────────────────────────────────
# Docs that require user approval before modification.

protected_docs:
  - "docs/decisions.md"
  - "docs/sero.md"
  - "AGENTS.md"

# ── Never Load ────────────────────────────────────────────────────────
# Docs excluded from task execution context (too large, irrelevant, etc.)

never_load:
  - "docs/container-integration/"
  - "docs/oauth-login/"
  - "docs/ideas/"
