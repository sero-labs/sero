# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Sero OpenShell runtime eval suite"

providers:
  - id: file://./seroProvider.ts
    label: "Sero OpenShell"
    config:
      timeout: 180000
      openShellRuntime:
        # Defaults to OpenShell Local. Override with environment variables for
        # remote/cloud runs without editing this file:
        #   SERO_EVAL_OPENSHELL_PROVIDER=openshell-remote
        #   SERO_EVAL_OPENSHELL_GATEWAY=sero-remote-gcp
        #   SERO_EVAL_OPENSHELL_SANDBOX_PREFIX=sero-eval-gcp
        # Optional remote auto-start settings:
        #   SERO_EVAL_OPENSHELL_SSH_HOST=user@host
        #   SERO_EVAL_OPENSHELL_SSH_KEY=/path/to/private-key
        #   SERO_EVAL_OPENSHELL_GATEWAY_HOST=public-host-or-ip
        #   SERO_EVAL_OPENSHELL_GATEWAY_PORT=18080
        # Optional cloud auto-register setting:
        #   SERO_EVAL_OPENSHELL_CLOUD_ENDPOINT=https://gateway.example.com
        retainSandboxes: failed

prompts:
  - "{{scenario_prompt}}"

tests:
  - file://./scenarios/openshell-runtime.yaml

defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-sonnet-4-6
