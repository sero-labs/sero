packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

# Security overrides. Keep each value unchanged unless the advisory changes.
overrides:
  keyv: "5.6.0"
  cache-manager: "7.2.8"
  cacheable-request: "7.0.4"
  "@cacheable/utils": "2.4.1"
  cacheable: "<2.5.1"
  "@cacheable/memory": "<2.2.1"
  "@cacheable/net": "<2.1.1"
  "@cacheable/node-cache": "<3.1.2"
  flat-cache: "<6.1.24"
  file-entry-cache: "<11.1.6"
  ecto: "<5.0.1"

# Every dependency build script needs a decision: true runs it, false skips it.
# The false entries are the scripts pnpm 10 skipped before this list existed.
allowBuilds:
  bun: true
  electron: true
  esbuild: true
  node-pty: true
  sharp: true
  "@google/genai": false
  "@parcel/watcher": false
  "@playwright/browser-chromium": false
  "@swc/core": false
  better-sqlite3: false
  core-js: false
  electron-winstaller: false
  koffi: false
  msw: false
  node-llama-cpp: false
  onnxruntime-node: false
  protobufjs: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  workerd: false

# ── Default catalog ────────────────────────────────────────────
# Single source of truth for shared dependency versions.
# Use "catalog:" in any package.json to reference these.
catalog:
  # React — keep both this catalog and `catalogs.peer` (below) on the SAME
  # range. Mismatched specs (e.g. exact here + ">=" peer) cause pnpm to
  # resolve transitive consumers (radix-ui, streamdown, recharts, …) against
  # a different react version than the apps, splitting the install into two
  # react copies and breaking hooks at runtime.
  react: "^19.2.8"
  react-dom: "^19.2.8"

  # Build tooling
  bun: "1.2.18"
  "@types/bun": "1.2.18"
  tailwindcss: "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  # Tailwind's browser build, inlined into Design Library previews (no network
  # inside the sandboxed frame, so the compiler has to travel with the page).
  "@tailwindcss/browser": "4.3.3"
  # Used at runtime by the Design Library plugin to bundle a generated React
  # page into one self-contained document. Kept external in the plugin bundle.
  esbuild: "0.28.1"
  typescript: "^5.9.3"
  vite: "6.4.3"
  "@vitejs/plugin-react": "^4.7.0"
  "@module-federation/vite": "1.21.6"

  # Types
  "@types/react": "^19.2.13"
  "@types/react-dom": "^19.2.3"
  jsdom: "^26.1.0"
  "@types/node": "^22.19.11"

  # Pi SDK
  "@earendil-works/pi-agent-core": "0.84.2"
  "@earendil-works/pi-ai": "0.84.2"
  "@earendil-works/pi-coding-agent": "0.84.2"
  "@earendil-works/pi-tui": "0.84.2"

  # Zod is a peer of Pi SDK transitives: openai, @anthropic-ai/sdk,
  # and zod-to-json-schema.
  zod: "^4.4.3"

  # Shared libraries
  "@a2a-js/sdk": "1.0.1"
  "@sinclair/typebox": "^0.34.52"
  typebox: "^1.3.14"
  lucide-react: "^1.28.0"
  motion: "^12.43.0"
  streamdown: "^2.5.0"
  vitest: "^4.1.10"
  zustand: "^5.0.11"

  # Diff rendering — pinned exactly; the desktop app and the git plugin must
  # not render diffs with two different versions of it.
  "@pierre/diffs": "1.3.5"
  "@pierre/trees": "1.0.0-beta.6"

# ── Named catalogs ─────────────────────────────────────────────
# Use "catalog:peer" in peerDependencies.
catalogs:
  peer:
    "@earendil-works/pi-agent-core": ">=0.84.2"
    "@earendil-works/pi-ai": ">=0.84.2"
    "@earendil-works/pi-coding-agent": ">=0.84.2"
    "@earendil-works/pi-tui": ">=0.84.2"
    # Mirror the strict catalog above. See the comment there for why these
    # MUST stay aligned.
    react: "^19.2.8"
    react-dom: "^19.2.8"
    zod: ">=4.0.0"
