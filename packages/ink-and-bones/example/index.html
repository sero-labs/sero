<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ink &amp; Bones — engine example</title>
<style>
  body {
    margin: 0;
    background: #191434;
    color: #e9e5f2;
    font: 14px/1.5 ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
  }
  h1 { font-size: 16px; margin: 0; }
  .muted { color: #8f8aa8; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  canvas#stage {
    background: #241d42;
    border: 1px solid #3b3252;
    image-rendering: pixelated;
  }
  canvas#strip {
    image-rendering: pixelated;
    max-width: 92vw;
    background: #241d42;
    border: 1px solid #3b3252;
  }
  button, label {
    background: #312653;
    color: #e9e5f2;
    border: 1px solid #3b3252;
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button.on { background: #4df5e3; color: #141021; }
  input[type="range"] { width: 140px; }
  pre#audit {
    margin: 0;
    font-size: 12px;
    color: #8f8aa8;
    text-align: left;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>Ink &amp; Bones — every frame drawn by code</h1>
  <div class="muted">The @sero-ai/ink-and-bones engine playing its reference puppets.</div>
  <div class="row" id="cast"></div>
  <div class="muted" id="blurb"></div>
  <div class="row" id="clips"></div>
  <div class="row">
    <button id="play">Pause</button>
    <label><input type="checkbox" id="bones" /> bones</label>
    <button id="theme">Theme</button>
  </div>
  <canvas id="stage"></canvas>
  <div class="muted" id="counter"></div>
  <div class="row" id="dials"></div>
  <div class="muted">Move a slider or flip the theme: the character rebakes from source. Edits are diffs.</div>
  <canvas id="strip"></canvas>
  <div class="muted" id="status"></div>
  <button id="run-audit">Run audit gates</button>
  <pre id="audit"></pre>
  <script src="dist/bundle.js"></script>
</body>
</html>
