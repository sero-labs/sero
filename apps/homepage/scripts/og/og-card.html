<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sero OG card source</title>
		<style>
			:root {
				--bg: #050605;
				--ink: #e6e3d8;
				--mute: #7d7a6f;
				--phos: oklch(59.6% 0.145 163.225);
				--phos-fb: #059669;
				--rule: rgba(230, 227, 216, 0.12);
				--rule-strong: rgba(230, 227, 216, 0.22);
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			html, body { width: 1200px; height: 630px; overflow: hidden; }
			body {
				background:
					repeating-linear-gradient(180deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 3px),
					radial-gradient(900px 500px at 80% -100px, rgba(5, 150, 105, 0.10), transparent 60%),
					radial-gradient(700px 400px at 100% 110%, rgba(240, 85, 35, 0.10), transparent 60%),
					var(--bg);
				color: var(--ink);
				font-family: "JetBrains Mono", ui-monospace, monospace;
				display: grid;
				grid-template-rows: 1fr auto;
				padding: 60px 72px;
			}
			.brand { display: flex; align-items: center; gap: 28px; margin-bottom: 24px; }
			.brand svg.emblem {
				width: 96px;
				height: auto;
				filter: drop-shadow(0 0 22px rgba(240, 85, 35, 0.40)) drop-shadow(0 0 80px rgba(240, 85, 35, 0.20));
			}
			.brand svg.logo { height: 56px; width: auto; color: var(--ink); }
			.tag {
				display: inline-flex; align-items: center; gap: 10px;
				font-size: 14px; color: var(--mute); letter-spacing: 0.06em;
				padding-top: 6px; border-top: 1px dashed var(--rule);
				width: fit-content; padding-right: 14px; margin-bottom: 36px;
			}
			.tag .dot { width: 8px; height: 8px; background: var(--phos-fb); background: var(--phos); box-shadow: 0 0 10px rgba(5,150,105,0.7); }
			h1 {
				font-family: "JetBrains Mono", ui-monospace, monospace;
				font-weight: 500;
				font-size: 92px;
				line-height: 0.96;
				letter-spacing: -0.04em;
				text-transform: lowercase;
				margin-top: auto;
			}
			h1 .accent { color: var(--phos-fb); color: var(--phos); display: block; margin-top: 4px; }
			footer {
				display: flex; align-items: center; justify-content: space-between;
				padding-top: 32px; border-top: 1px solid var(--rule);
				font-size: 16px; color: var(--mute); letter-spacing: 0.04em;
			}
			footer .url { color: var(--ink); }
			footer .meta { color: var(--mute); }
		</style>
	</head>
