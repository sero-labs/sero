<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tool check page</title></head>
<body>
  <h1 id="heading">Tool check page</h1>
  <p id="body-text">The quick brown fox jumps over the lazy dog.</p>
  <label for="name">Name</label>
  <input id="name" name="name" autocomplete="off">
  <button id="greet" type="button" onclick="document.getElementById('greeting').textContent = 'Hello, ' + document.getElementById('name').value">Greet</button>
  <p id="greeting"></p>
  <div id="spacer" style="height: 3000px"></div>
  <p id="bottom">Bottom of the page</p>
</body>
</html>
