# Sero — electron-builder configuration
# Docs: https://www.electron.build/configuration

appId: app.sero
productName: Sero
copyright: Copyright © 2025-2026 Sero

# ── Auto-update feed ──────────────────────────────────────────
# electron-builder embeds an app-update.yml pointing here and emits the
# latest*.yml + .blockmap metadata that electron-updater consumes.
publish:
  provider: github
  owner: sero-labs
  repo: sero

# ── Output ────────────────────────────────────────────────────
directories:
  output: release
  buildResources: build

# ── Files to include in the app bundle ────────────────────────
# electron-builder copies these into the .app/Contents/Resources/app/
files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - package.json
  # Browser-pack archives are release toolchain artifacts and must stay outside
  # packaged app bundles. The app downloads/verifies them from published metadata.
  - "!dist/browser-pack/**"
  - "!release/**"
  # Native modules — electron-builder rebuilds these for the target
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*
  # Sero workspace packages + Pi SDK dependencies (externalized by builds)
  - node_modules/@sero-ai/**/*
  - node_modules/@mariozechner/**/*
  - node_modules/@sinclair/**/*
  - node_modules/@google/**/*
  # Pi SDK runtime syntax highlighting dependencies. Include these explicitly so
  # pnpm's nested chalk@4 dependency does not resolve to an incompatible chalk@5
  # or ansi-styles@6 when packaged into app.asar.
  - node_modules/cli-highlight/**/*
  - node_modules/chalk/**/*
  - node_modules/ansi-styles/**/*
  - node_modules/supports-color/**/*
  - node_modules/ws/**/*
  - node_modules/discord.js/**/*
  - node_modules/@discordjs/**/*
  # Exclude dev/build artifacts
  - "!**/{test,tests,__tests__,__mocks__}/**"
  # Keep .ts sources: Pi package extensions are loaded via jiti at runtime,
  # including the built-in packages staged under dist/electron/builtin/.
  - "!**/*.{tsx,map}"
  - "!**/node_modules/.cache/**"

# ── asar ──────────────────────────────────────────────────────
asar: true
asarUnpack:
  # Native modules must be unpacked (they contain .node binaries)
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*

# ── macOS ─────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - arm64
    # zip is required for Squirrel.Mac auto-update (it cannot update from a dmg).
    # The dmg is the first-install download; the zip is the updater feed artifact.
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"
  # Icon auto-discovered from build/ directory.
  # Generate with: bash scripts/generate-icon.sh path/to/1024x1024.png
  # icon: build/icon.icns
  darkModeSupport: true
  # hardenedRuntime/entitlements apply only to signed (CSC_LINK) builds. Unsigned beta builds are
  # ad-hoc signed without hardened runtime by scripts/after-pack.mjs.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# ── Linux ─────────────────────────────────────────────────────
linux:
  maintainer: Sero Labs <hello@sero.ai>
  target:
    - deb
  category: Development
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

# ── Windows ───────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"

# ── DMG options ───────────────────────────────────────────────
dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"

nsis:
  artifactName: "${productName}-${version}-windows-${arch}-setup.${ext}"

# ── Code signing — set CSC_LINK / CSC_KEY_PASSWORD env vars ──
# When not set, the app is built unsigned (fine for local dev).
# For distribution, export your Developer ID certificate as .p12
# and set:
#   CSC_LINK=path/to/cert.p12
#   CSC_KEY_PASSWORD=your-password
#
# Notarization (optional, for distribution outside App Store):
#   APPLE_ID=your@apple.id
#   APPLE_APP_SPECIFIC_PASSWORD=app-specific-password
#   APPLE_TEAM_ID=your-team-id
afterSign: null
afterPack: scripts/after-pack.mjs

# ── Native module rebuild ─────────────────────────────────────
# Disabled here because pnpm workspace symlinks break electron-builder's
# built-in rebuild. Native modules (node-pty, better-sqlite3) are rebuilt
# manually via `electron-rebuild` in build-release.sh (step 5) instead.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Bundle the sero-doctor CLI shim. On first run Sero offers to symlink
# this to /usr/local/bin/sero-doctor (declined by default).
extraResources:
  - from: scripts/sero-doctor.sh
    to: sero-doctor
