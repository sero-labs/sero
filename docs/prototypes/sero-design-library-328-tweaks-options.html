<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue 328 — baseline Tweaks options</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#0e0e10;--raised:#18181b;--line:#28282d;--line2:#3a3a42;--text:#f4f4f5;--muted:#858590;--green:#34d399;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--panel);color:var(--text);font-family:var(--sans)}button,select,input{font:inherit}.panel{width:360px;height:760px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line)}
    header{padding:15px 16px 13px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--green);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.title{margin-top:5px;font-size:19px;font-weight:650}.meta{margin-top:4px;color:var(--muted);font-size:12px}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px 0}.tab{height:31px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px}.tab.on{background:var(--raised);color:var(--text)}
    .content{min-height:0;flex:1;overflow:hidden;padding:14px 16px}.group{margin-bottom:20px}.group-title{display:flex;align-items:center;gap:9px;margin-bottom:13px;color:#a4a4ad;font-size:10px;font-weight:650;letter-spacing:.09em;text-transform:uppercase}.group-title:after{content:"";height:1px;flex:1;background:var(--line)}
    .control{margin-bottom:14px}.row{display:flex;align-items:center;margin-bottom:7px;font-size:12px}.value{margin-left:auto;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.select{width:100%;height:31px;padding:0 9px;border:1px solid var(--line2);border-radius:6px;background:var(--raised);color:#d7d7dc;font-size:11px}.choices{display:flex;gap:4px}.choice{height:28px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px}.choice.on{background:var(--raised);color:var(--text)}
    input[type=range]{width:100%;height:4px;margin:5px 0 0;appearance:none;border-radius:3px;background:linear-gradient(90deg,var(--green) 0 56%,#34343a 56%)}input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border:2px solid var(--panel);border-radius:50%;background:var(--green);box-shadow:0 0 0 1px #65e2b5}
    footer{height:49px;display:flex;align-items:center;gap:7px;padding:0 12px;border-top:1px solid var(--line)}footer button{height:29px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:#aaaab2;font-size:11px}.edited{margin-left:auto;color:var(--muted);font-size:11px}.note{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.45}.note b{color:#c7c7cd;font-weight:600}
  </style>
</head>
<body>
<main class="panel">
  <header><div class="eyebrow">Variant 01 · Ready</div><div class="title">Signal ledger</div><div class="meta">Web prototype · balanced influence</div></header>
  <nav class="tabs"><button class="tab">Design</button><button class="tab">Files</button><button class="tab">History</button><button class="tab on">Tweaks</button><button class="tab">Art</button></nav>
  <section class="content" id="content"></section>
  <div class="note" id="note"></div>
  <footer><button>Reset all</button><button>Copy CSS</button><span class="edited">0 edited</span></footer>
</main>
<script>
  const option=new URLSearchParams(location.search).get('option')||'a';
  const range=(label,value,min=0,max=100)=>`<div class="control"><div class="row"><span>${label}</span><span class="value">${value}</span></div><input aria-label="${label}" type="range" min="${min}" max="${max}" value="56"></div>`;
  const font=(label,value)=>`<div class="control"><div class="row"><span>${label}</span><span class="value">${value}</span></div><select class="select" aria-label="${label}"><option>${value}</option></select></div>`;
  const weight=`<div class="control"><div class="row"><span>H1 weight</span><span class="value">650</span></div><div class="choices"><button class="choice">400</button><button class="choice">500</button><button class="choice on">650</button><button class="choice">800</button></div></div>`;
  const baseline=font('Font','Inter')+range('H1 size','56px')+weight+range('H1 tracking','-0.04em')+range('H2 size','28px')+font('Body font','Inter')+range('Body size','16px');
  const custom=range('Panel spacing','24px')+range('Chart height','320px');
  const content=document.querySelector('#content');const note=document.querySelector('#note');
  if(option==='a'){
    content.innerHTML=`<div class="group"><div class="group-title">Typography</div>${baseline}</div><div class="group"><div class="group-title">This page</div>${custom}</div>`;
    note.innerHTML='<b>Guaranteed by generation.</b> Every page declares these properties; page-specific controls follow.';
  }else if(option==='b'){
    content.innerHTML=`<div class="group"><div class="group-title">Type</div>${baseline}</div><div class="group"><div class="group-title">Layout</div>${custom}</div>`;
    note.innerHTML='<b>Added after generation.</b> Sero rewrites a page when these properties were not declared.';
  }else{
    content.innerHTML=`<div class="group"><div class="group-title">Type</div>${font('Font','Inter')+range('Body size','16px')}</div><div class="group"><div class="group-title">Layout</div>${custom}</div>`;
    note.innerHTML='<b>Only supported controls appear.</b> This page did not expose H1 or H2 properties.';
  }
</script>
</body>
</html>
