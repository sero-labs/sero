name: E2E Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: LLM tier to run
        required: true
        default: cheap
        type: choice
        options:
          - cheap
          - full
      provider:
        description: LLM provider
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - anthropic
          - openai
          - google
      model:
        description: Optional model override
        required: false
        type: string
      alternate-model:
        description: Optional explicit alternate model for model-switch coverage
        required: false
        type: string
      spec:
        description: Optional spec file to run instead of the full agent project (e.g. e2e/agent-realism.agent.spec.ts)
        required: false
        type: string
      grep:
        description: Optional title filter for a single test
        required: false
        type: string
      retries:
        description: Optional retry count override (use 0 to make a flake fail)
        required: false
        type: string
  schedule:
    - cron: '27 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  SERO_E2E_LLM_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'cheap' }}
  SERO_E2E_LLM_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'openrouter' }}
  SERO_E2E_LLM_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || '' }}
  SERO_E2E_LLM_ALT_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.alternate-model || '' }}
  SERO_E2E_PREBUILT_PLUGINS: 1
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  agent:
    name: Agent realism (${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'cheap' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install Linux display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build E2E plugin remotes
        run: |
          pnpm --filter @sero-ai/plugin-orchestrator... --filter @sero-ai/plugin-mcp... build
          node scripts/build-plugin.mjs plugins/sero-orchestrator-plugin --quiet
          node scripts/build-plugin.mjs plugins/sero-mcp-plugin --quiet

      - name: Install Playwright Chromium
        run: pnpm --filter @sero/desktop exec playwright install chromium

      - name: Verify selected provider secret
        shell: bash
        run: |
          case "$SERO_E2E_LLM_PROVIDER" in
            openrouter)
              test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing OPENROUTER_API_KEY secret for agent e2e"; exit 1; }
              ;;
            anthropic)
              test -n "$ANTHROPIC_API_KEY" || { echo "::error::Missing ANTHROPIC_API_KEY secret for agent e2e"; exit 1; }
              ;;
            openai)
              test -n "$OPENAI_API_KEY" || { echo "::error::Missing OPENAI_API_KEY secret for agent e2e"; exit 1; }
              ;;
            google)
              test -n "$GEMINI_API_KEY$GOOGLE_API_KEY" || { echo "::error::Missing GEMINI_API_KEY or GOOGLE_API_KEY secret for agent e2e"; exit 1; }
              ;;
            *)
              echo "::error::Unsupported SERO_E2E_LLM_PROVIDER=$SERO_E2E_LLM_PROVIDER"
              exit 1
              ;;
          esac

      - name: Build desktop
        run: pnpm --filter @sero/desktop build

      - name: Run agent infrastructure checks
        run: |
          pnpm --filter @sero/desktop exec vitest run electron/__tests__/features/plugins/plugin-cli-bridge.test.ts
          xvfb-run -a pnpm --filter @sero/desktop exec playwright test \
            e2e/plugins.workflow.spec.ts e2e/mcp.contract.spec.ts \
            --grep 'opens orchestrator|bridges the MCP proxy' \
            --retries=0

      - name: Run agent e2e
        shell: bash
        env:
          E2E_SPEC: ${{ inputs.spec }}
          E2E_GREP: ${{ inputs.grep }}
          E2E_RETRIES: ${{ inputs.retries }}
        run: |
          # No --pass-with-no-tests: a typo'd spec/grep must fail, not go green.
          args=(--project=agent)
          if [ -n "$E2E_SPEC" ]; then args+=("$E2E_SPEC"); fi
          if [ -n "$E2E_GREP" ]; then args+=(--grep "$E2E_GREP"); fi
          if [ -n "$E2E_RETRIES" ]; then args+=("--retries=$E2E_RETRIES"); fi
          xvfb-run -a pnpm --filter @sero/desktop exec playwright test "${args[@]}"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-agent-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'cheap' }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
