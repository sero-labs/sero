name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name to publish; checkout uses the ref selected when starting the workflow
        type: string
        required: false
      draft:
        description: Create or update as draft release
        type: boolean
        default: true
      publish_run_id:
        description: Existing workflow run ID containing desktop-release-* artifacts; skips rebuild
        type: string
        required: false
      release_target:
        description: Build one release target for testing, or all targets for a full release
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - linux-x64
          - linux-arm64
          - windows-x64
      publish:
        description: Create/update the GitHub Release after artifacts are available
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096
  SERO_E2E_RUNTIME: host
  SERO_HOST_FIRST: '1'
  SERO_E2E_HOST_RELEASE_SMOKE: '1'
  SERO_E2E_FORCE_MANAGED_TOOLS: node,npm,pnpm

jobs:
  prepare-matrix:
    name: Prepare release target matrix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.release_target || 'all' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const targets = [
            { target: 'macos-arm64', os: 'macos', arch: 'arm64', runner: 'macos-15', dist: 'dist:mac' },
            { target: 'linux-x64', os: 'linux', arch: 'x64', runner: 'ubuntu-24.04', dist: 'dist:linux:x64' },
            { target: 'linux-arm64', os: 'linux', arch: 'arm64', runner: 'ubuntu-24.04-arm', dist: 'dist:linux:arm64' },
            { target: 'windows-x64', os: 'windows', arch: 'x64', runner: 'windows-latest', dist: 'dist:win' },
          ];
          const requested = process.env.RELEASE_TARGET || 'all';
          const include = requested === 'all'
            ? targets
            : targets.filter((target) => target.target === requested);
          if (include.length === 0) {
            throw new Error(`Unknown release target: ${requested}`);
          }
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE

  build:
    name: Build release (${{ matrix.target }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}
    needs: prepare-matrix
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux display dependencies
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Validate Windows bash/MSYS prerequisites
        if: ${{ matrix.os == 'windows' }}
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) ;;
            *)
              echo "::error::Windows desktop release requires Git Bash/MSYS bash; got $(uname -s). Install Git for Windows and run this github-hosted runner with bash on PATH."
              exit 1
              ;;
          esac
          command -v bash >/dev/null 2>&1 || { echo "::error::bash is missing from PATH"; exit 1; }
          command -v git >/dev/null 2>&1 || { echo "::error::git is missing from PATH"; exit 1; }

      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Check workflow prerequisites
        run: apps/desktop/scripts/e2e-doctor.sh workflow

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify published browser packs
        run: pnpm --filter @sero/desktop browser-pack:verify-published

      - name: Verify published core toolchains
        run: pnpm --filter @sero/desktop toolchain:verify-published

      - name: Run host release smoke
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a pnpm --filter @sero/desktop e2e:workflow runtime-host-release.workflow.spec.ts
          else
            pnpm --filter @sero/desktop e2e:workflow runtime-host-release.workflow.spec.ts
          fi

      - name: Build packaged artifacts
        # Apple signing/notarization secrets are passed only on macOS. Until they
        # are configured they resolve to empty, so build-release.sh falls back to
        # the unsigned ad-hoc flow. Non-macOS runners never receive them.
        env:
          CSC_LINK: ${{ matrix.os == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm --filter @sero/desktop ${{ matrix.dist }}

      - name: Verify macOS app bundle
        if: ${{ matrix.os == 'macos' }}
        run: |
          set -euo pipefail
          # electron-builder emits to mac/ (x64), mac-arm64/, or mac-universal/ depending on arch.
          app_path="$(find apps/desktop/release -maxdepth 2 -type d -name 'Sero.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No Sero.app found under apps/desktop/release"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app_path"

      - name: Smoke test Linux Debian artifact
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get install -y ./apps/desktop/release/*.deb
          trap 'sudo apt-get remove -y sero' EXIT
          set +e
          timeout 30 xvfb-run -a /opt/Sero/@serodesktop --doctor --quick --json > /tmp/sero-doctor.json 2> /tmp/sero-doctor.err
          status=$?
          set -e
          if ! node <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/sero-doctor.json', 'utf8');
          const start = output.indexOf('{');
          const end = output.lastIndexOf('}');
          if (start === -1 || end === -1 || end < start) {
            throw new Error('Doctor output did not contain a JSON object');
          }
          JSON.parse(output.slice(start, end + 1));
          NODE
          then
            cat /tmp/sero-doctor.err >&2 || true
            cat /tmp/sero-doctor.json >&2 || true
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            cat /tmp/sero-doctor.err >&2 || true
            exit "$status"
          fi
          set +e
          timeout 15 xvfb-run -a /opt/Sero/@serodesktop > /tmp/sero-ui-smoke.out 2> /tmp/sero-ui-smoke.err
          ui_status=$?
          set -e
          cat /tmp/sero-ui-smoke.err
          if grep -E "cli-highlight|Cannot read properties of undefined|UnhandledPromiseRejection" /tmp/sero-ui-smoke.err; then
            exit 1
          fi
          if [ "$ui_status" -ne 0 ] && [ "$ui_status" -ne 124 ]; then
            exit "$ui_status"
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.target }}
          path: |
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-debug.yml
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-${{ matrix.target }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: ${{ always() && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish && (inputs.publish_run_id != '' || needs.build.result == 'success'))) }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
      RELEASE_ARTIFACT_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check release token before downloading artifacts
        run: gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name

      - name: Extract changelog release notes
        run: |
          set -euo pipefail
          git fetch --force --tags
          git show "$RELEASE_TAG:CHANGELOG.md" > "$RUNNER_TEMP/release-changelog.md"
          node scripts/extract-changelog-release-notes.mjs "$RELEASE_TAG" release-notes.md "$RUNNER_TEMP/release-changelog.md"

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          path: release-artifacts
          merge-multiple: true
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify downloaded release artifacts
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifact files downloaded from run ${RELEASE_ARTIFACT_RUN_ID}"
            find release-artifacts -maxdepth 2 -print || true
            exit 1
          fi
          printf 'Downloaded %d release artifact file(s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"

      - name: Create or update release shell
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::Release tag is required"
            exit 1
          fi

          draft_args=()
          create_args=(--verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            draft_args=(--draft)
            create_args+=(--draft)
          else
            draft_args=(--draft=false)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file release-notes.md "${draft_args[@]}"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${create_args[@]}"
          fi

      - name: Remove stale release assets
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ "$asset" == builder-debug.yml || ( "$asset" == Sero-* && "$asset" != Sero-"$release_version"-* ) ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done

      - name: Upload release assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifact files to upload from run ${RELEASE_ARTIFACT_RUN_ID}"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
