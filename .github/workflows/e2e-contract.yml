name: E2E Contract

# Ad-hoc only. Run it by hand when a change needs the evidence; it is not
# triggered by a pull request, a push, or a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  contract:
    name: Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Archived OpenSpec evidence paths exceed Windows' 260-character limit.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.5.1
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin Vite helpers
        run: pnpm --filter @sero-ai/plugin-vite build

      - name: Run contract e2e
        if: runner.os != 'Linux'
        run: pnpm --filter @sero/desktop e2e:contract

      - name: Run contract e2e (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @sero/desktop e2e:contract

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-contract-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
