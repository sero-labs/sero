name: Browser Pack Artifacts

on:
  workflow_dispatch:
    inputs:
      commit_metadata:
        description: Commit generated-artifacts.json after verification
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  BROWSER_PACK_RELEASE: >-
    browser-pack-2026-11-08-r1248-f6.1.1-mf6.1.1-agent-0.41.2
  BROWSER_PACK_DIR: apps/desktop/dist/browser-pack/2026-11-08

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure-release:
    name: Ensure browser-pack release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$BROWSER_PACK_RELEASE" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $BROWSER_PACK_RELEASE already exists."
            exit 0
          fi
          notes="Pinned host browser automation packs for Sero."
          notes="$notes Integrity is enforced by generated-artifacts.json"
          notes="$notes SHA-256 metadata."
          gh release create "$BROWSER_PACK_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sero Browser Pack 2026-11-08" \
            --notes "$notes" \
            --prerelease

  build:
    name: Build ${{ matrix.slug }}
    needs: ensure-release
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: mac-arm64
            label: macOS Apple Silicon
            runner: macos-15
            archive: mac-arm64.tar.gz
            receipt: mac-arm64.json
          - slug: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            archive: linux-x64.tar.gz
            receipt: linux-x64.json
          - slug: linux-arm64
            label: Linux arm64
            runner: ubuntu-24.04-arm
            archive: linux-arm64.tar.gz
            receipt: linux-arm64.json
          - slug: win-x64
            label: Windows x64 Git Bash
            runner: windows-latest
            archive: win-x64.tar.gz
            receipt: win-x64.json
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Archived OpenSpec evidence paths exceed Windows' 260-character limit.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate native build host
        run: |
          echo "runner label: ${{ matrix.label }}"
          echo "uname -s: $(uname -s)"
          echo "uname -m: $(uname -m)"
          host_os=$(uname -s)
          host_arch=$(uname -m)
          case "${{ matrix.slug }}" in
            mac-arm64)
              [[ "$host_os" == "Darwin" && "$host_arch" == "arm64" ]] || exit 1
              ;;
            linux-x64)
              [[ "$host_os" == "Linux" && "$host_arch" == "x86_64" ]] || exit 1
              ;;
            linux-arm64)
              [[ "$host_os" == "Linux" ]] || exit 1
              [[ "$host_arch" == "aarch64" ]] || \
                [[ "$host_arch" == "arm64" ]] || exit 1
              ;;
            win-x64)
              case "$host_os" in MINGW*|MSYS*|CYGWIN*) ;; *) exit 1 ;; esac
              [[ "$host_arch" == "x86_64" ]] || exit 1
              ;;
            *)
              echo "Unknown browser-pack target: ${{ matrix.slug }}"
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.5.1
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser pack
        run: |
          pnpm --filter @sero/desktop browser-pack:build -- \
            --metadata-out dist/browser-pack/2026-11-08

      - name: Verify expected files
        run: |
          test -s "$BROWSER_PACK_DIR/${{ matrix.archive }}"
          test -s "$BROWSER_PACK_DIR/${{ matrix.receipt }}"
          node -e "const fs=require('fs'); const argv=process.argv; \
            const receipt=JSON.parse(fs.readFileSync(argv[1], 'utf8')); \
            if (receipt.slug !== '${{ matrix.slug }}') \
              throw new Error('unexpected slug: '+receipt.slug);" \
            "$BROWSER_PACK_DIR/${{ matrix.receipt }}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$BROWSER_PACK_RELEASE" \
            "$BROWSER_PACK_DIR/${{ matrix.archive }}" \
            "$BROWSER_PACK_DIR/${{ matrix.receipt }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload receipt workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-pack-receipt-${{ matrix.slug }}
          path: ${{ env.BROWSER_PACK_DIR }}/${{ matrix.receipt }}
          if-no-files-found: error
          retention-days: 14

  merge-metadata:
    name: Merge and verify browser-pack metadata
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.5.1
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release receipt JSON files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$BROWSER_PACK_DIR"
          for receipt in \
            mac-arm64.json linux-x64.json linux-arm64.json win-x64.json; do
            gh release download "$BROWSER_PACK_RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$receipt" \
              --dir "$BROWSER_PACK_DIR" \
              --clobber
          done
          ls -la "$BROWSER_PACK_DIR"

      - name: Merge committed metadata
        run: |
          pnpm --filter @sero/desktop browser-pack:merge-metadata -- \
            --sidecar-dir dist/browser-pack/2026-11-08

      - name: Verify published artifacts
        run: pnpm --filter @sero/desktop browser-pack:verify-published

      - name: Verify desktop release metadata
        run: pnpm --filter @sero/desktop verify:host-mode-release

      - name: Upload generated metadata
        uses: actions/upload-artifact@v7
        with:
          name: browser-pack-generated-artifacts
          path: apps/desktop/electron/**/generated-artifacts.json
          if-no-files-found: error
          retention-days: 30

      - name: Create metadata pull request token
        if: ${{ inputs.commit_metadata == 'true' }}
        id: metadata_token
        # Long line on purpose: Actions rejects a shortened commit SHA.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RUNTIME_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.RUNTIME_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open metadata update pull request
        if: ${{ inputs.commit_metadata == 'true' }}
        env:
          # github.token cannot open pull requests in this repository.
          GH_TOKEN: ${{ steps.metadata_token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "generated-artifacts.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.email "$bot_email"
          branch="chore/browser-pack-metadata-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -u
          git commit -m "chore(desktop): publish browser pack metadata"
          token_url="https://x-access-token:${GH_TOKEN}@github.com/"
          git remote set-url origin "${token_url}${GITHUB_REPOSITORY}.git"
          git push origin HEAD:"$branch"
          body="Browser-pack metadata for the assets published by this run."
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(desktop): publish browser pack metadata" \
            --body "$body"

      - name: Summary
        run: |
          {
            echo "## Browser-pack artifacts"
            echo
            echo "Release assets uploaded and verified for macOS arm64, Linux"
            echo "x64, Linux arm64, and Windows x64."
            echo
            echo "Generated metadata artifact: browser-pack-generated-artifacts"
            if [[ "${{ inputs.commit_metadata }}" == "true" ]]; then
              echo
              echo "Metadata commit requested: yes"
            else
              echo
              echo "Metadata commit requested: no. Download the workflow"
              echo "artifact and commit generated-artifacts.json manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
