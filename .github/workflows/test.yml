name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SERO_SKIP_NATIVE_REBUILD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      base: ${{ steps.filter.outputs.base }}
      head: ${{ steps.filter.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce repository layout
        run: node scripts/check-repository-layout.mjs
      - id: filter
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base=""
            head="${{ github.sha }}"
          fi

          full=false
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            full=true
            echo "No usable base commit; using the full run."
          else
            changed_files="$(git diff --name-only "$base" "$head")"
            printf '%s\n' "Changed files:" "$changed_files"
            while IFS= read -r file; do
              case "$file" in
                assets/*|eval/*|packages/templates/*|plugins/sero-*-plugin/package.json|doctor.config.jsonc|promptfooconfig.yaml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|scripts/*|.github/workflows/test.yml)
                  full=true
                  ;;
              esac
            done <<< "$changed_files"
          fi
          [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && full=true
          {
            echo "full=$full"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

  source-typecheck:
    name: Source typecheck
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22.19.0, cache: pnpm }
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS; pnpm install --frozen-lockfile; echo "Install took $((SECONDS - start))s"
      - name: Report remote cache configuration
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [[ -n "${TURBO_TOKEN:-}" && -n "${TURBO_TEAM:-}" ]]; then echo 'Turbo remote cache credentials: present'; else echo 'Turbo remote cache credentials: absent (local cache only)'; fi
      - name: Typecheck source
        shell: bash
        env:
          FULL_RUN: ${{ needs.changes.outputs.full }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$FULL_RUN" == "true" ]]; then
            pnpm turbo run typecheck --filter='!@sero/desktop' --summarize
            pnpm turbo run typecheck:source --filter=@sero/desktop --summarize
          else
            pnpm turbo run typecheck --filter='!@sero/desktop' --affected --summarize
            pnpm turbo run typecheck:source --filter=@sero/desktop --affected --summarize
          fi
          echo "Source typecheck took $((SECONDS - start))s"
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turbo-runs-${{ github.run_id }}-${{ github.job }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  test-typecheck:
    name: Test typecheck
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22.19.0, cache: pnpm }
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS; pnpm install --frozen-lockfile; echo "Install took $((SECONDS - start))s"
      - name: Report remote cache configuration
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [[ -n "${TURBO_TOKEN:-}" && -n "${TURBO_TEAM:-}" ]]; then echo 'Turbo remote cache credentials: present'; else echo 'Turbo remote cache credentials: absent (local cache only)'; fi
      - name: Typecheck tests
        shell: bash
        env:
          FULL_RUN: ${{ needs.changes.outputs.full }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$FULL_RUN" == "true" ]]; then pnpm turbo run typecheck:tests --filter=@sero/desktop --summarize; else pnpm turbo run typecheck:tests --filter=@sero/desktop --affected --summarize; fi
          echo "Test typecheck took $((SECONDS - start))s"
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turbo-runs-${{ github.run_id }}-${{ github.job }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  build:
    name: Build
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22.19.0, cache: pnpm }
      - name: Install dependencies
        shell: bash
        run: start=$SECONDS; pnpm install --frozen-lockfile; echo "Install took $((SECONDS - start))s"
      - name: Report remote cache configuration
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [[ -n "${TURBO_TOKEN:-}" && -n "${TURBO_TEAM:-}" ]]; then echo 'Turbo remote cache credentials: present'; else echo 'Turbo remote cache credentials: absent (local cache only)'; fi
      - name: Build
        shell: bash
        env:
          FULL_RUN: ${{ needs.changes.outputs.full }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$FULL_RUN" == "true" ]]; then pnpm turbo run build --summarize; else pnpm turbo run build --affected --summarize; fi
          echo "Build took $((SECONDS - start))s"
      - name: Packaging tests
        shell: bash
        env:
          FULL_RUN: ${{ needs.changes.outputs.full }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$FULL_RUN" == "true" ]]; then pnpm turbo run test:packaging --filter=@sero/desktop --summarize; else pnpm turbo run test:packaging --filter=@sero/desktop --affected --summarize; fi
          echo "Packaging tests took $((SECONDS - start))s"
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turbo-runs-${{ github.run_id }}-${{ github.job }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  tests:
    name: Tests
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22.19.0, cache: pnpm }
      - name: Install dependencies
        shell: bash
        run: start=$SECONDS; pnpm install --frozen-lockfile; echo "Install took $((SECONDS - start))s"
      - name: Report remote cache configuration
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [[ -n "${TURBO_TOKEN:-}" && -n "${TURBO_TEAM:-}" ]]; then echo 'Turbo remote cache credentials: present'; else echo 'Turbo remote cache credentials: absent (local cache only)'; fi
      - name: Tests
        shell: bash
        env:
          FULL_RUN: ${{ needs.changes.outputs.full }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$FULL_RUN" == "true" ]]; then pnpm turbo run test --summarize; else pnpm turbo run test --affected --summarize; fi
          echo "Tests took $((SECONDS - start))s"
      - name: Advisory test report
        if: always()
        shell: bash
        run: node scripts/test-advisory.mjs --format=github | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: turbo-runs-${{ github.run_id }}-${{ github.job }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore

  workflow-metrics:
    name: CI feedback metrics
    needs: [changes, source-typecheck, test-typecheck, build, tests]
    if: always() && needs.changes.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report recent workflow duration
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-workflow-metrics.mjs --workflow=test.yml --target-seconds=300 >> "$GITHUB_STEP_SUMMARY"

  pr-gate:
    name: PR Gate
    needs: [changes, source-typecheck, test-typecheck, build, tests]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_TYPECHECK_RESULT: ${{ needs.source-typecheck.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          TEST_TYPECHECK_RESULT: ${{ needs.test-typecheck.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then exit 1; fi
          if [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then echo 'External fork PR: compute-heavy checks skipped.'; exit 0; fi
          for result in "$SOURCE_TYPECHECK_RESULT" "$TEST_TYPECHECK_RESULT" "$BUILD_RESULT" "$TESTS_RESULT"; do [[ "$result" == success ]] || exit 1; done
          echo 'PR gate passed.'
