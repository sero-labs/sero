name: Dependabot auto-merge

# Maintainer PRs are merged by hand, on purpose. A merge made with
# GITHUB_TOKEN starts no further workflows (GitHub's loop guard), so
# auto-merging our own PRs silently skipped Deploy and Test on main —
# that is how the Rooms docs sat unpublished from 17 Aug.
#
# Dependabot keeps auto-merge: those PRs must pass the required PR Gate
# before it fires, and the filter below admits only security updates and
# minor/patch bumps. Their merges skip post-merge workflows too, which is
# acceptable because nothing they change ships to users on its own.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Pinned commit from GitHub's Dependabot automation documentation.
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}
      - name: Enable squash auto-merge
        if: >-
          steps.metadata.outputs.dependency-group-name == 'security-updates' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --auto
