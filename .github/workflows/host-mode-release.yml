name: Host Mode Release Gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target to run
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - linux-x64
          - linux-arm64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  SERO_E2E_RUNTIME: host
  SERO_HOST_FIRST: '1'
  SERO_E2E_HOST_RELEASE_SMOKE: '1'

jobs:
  prepare-matrix:
    name: Prepare release target matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const requested = process.env.REQUESTED_TARGET || 'all';
          const targets = {
            'macos-arm64': { target: 'macos-arm64', os: 'macos', arch: 'arm64', runner: 'macos-15', dist: 'dist:mac' },
            'linux-x64': { target: 'linux-x64', os: 'linux', arch: 'x64', runner: 'ubuntu-24.04', dist: 'dist:linux:x64' },
            'linux-arm64': { target: 'linux-arm64', os: 'linux', arch: 'arm64', runner: 'ubuntu-24.04-arm', dist: 'dist:linux:arm64' },
            'windows-x64': { target: 'windows-x64', os: 'windows', arch: 'x64', runner: 'windows-latest', dist: 'dist:win' },
          };
          const include = requested === 'all' ? Object.values(targets) : [targets[requested]];
          if (include.some((target) => !target)) throw new Error(`Unknown host release target: ${requested}`);
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE

  host-release:
    name: Host release (${{ matrix.target }})
    needs: prepare-matrix
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux display dependencies
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Validate Windows bash/MSYS prerequisites
        if: ${{ matrix.os == 'windows' }}
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) ;;
            *)
              echo "::error::Windows host release requires Git Bash/MSYS bash; got $(uname -s). Install Git for Windows and run this github-hosted runner with bash on PATH."
              exit 1
              ;;
          esac
          command -v bash >/dev/null 2>&1 || { echo "::error::bash is missing from PATH"; exit 1; }
          command -v git >/dev/null 2>&1 || { echo "::error::git is missing from PATH"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check workflow prerequisites
        run: apps/desktop/scripts/e2e-doctor.sh workflow

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify published browser packs
        run: pnpm --filter @sero/desktop browser-pack:verify-published

      - name: Run host release smoke
        id: smoke
        continue-on-error: true
        run: |
          if [[ "${{ matrix.os }}" == "linux" ]] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a pnpm --filter @sero/desktop e2e:workflow -- runtime-host-release.workflow.spec.ts
          else
            pnpm --filter @sero/desktop e2e:workflow -- runtime-host-release.workflow.spec.ts
          fi

      - name: Build packaged artifacts
        id: packages
        continue-on-error: true
        run: pnpm --filter @sero/desktop ${{ matrix.dist }}

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-mode-release-${{ matrix.target }}-packages
          path: apps/desktop/release/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: always() && steps.smoke.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: host-mode-release-${{ matrix.target }}-playwright
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if release gate failed
        if: always()
        run: |
          failed=0
          if [[ "${{ steps.smoke.outcome }}" != "success" ]]; then
            echo "::error::Host release smoke failed for ${{ matrix.target }}"
            failed=1
          fi
          if [[ "${{ steps.packages.outcome }}" != "success" ]]; then
            echo "::error::Packaged artifact build failed for ${{ matrix.target }}"
            failed=1
          fi
          exit "$failed"
