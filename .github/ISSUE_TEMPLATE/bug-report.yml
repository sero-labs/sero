name: Bug report
description: Report a defect, regression, or broken workflow in Sero.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please do not include secrets, tokens, private local paths, or raw auth files.
        For security vulnerabilities, use the private process in `SECURITY.md` instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime mode
      options:
        - Container-backed
        - Host mode
        - Not sure
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Supported beta targets are macOS Apple Silicon, Linux x64/arm64, and Windows x64.
      placeholder: macOS 26 / Apple Silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sero version or commit
      description: Release tag, branch, or commit SHA if known.
      placeholder: main @ abc1234
  - type: input
    id: model-provider
    attributes:
      label: Model provider
      description: Which model/provider were you using (if the bug involves the agent)?
      placeholder: e.g. Anthropic Claude, OpenAI, local OpenAI-compatible server
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or extra context
      description: >-
        Logs live in `~/.sero-ui/logs/`. Redact secrets and private local paths
        before pasting anything.
