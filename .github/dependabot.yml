version: 2

updates:
  # The root pnpm lockfile covers every package in the workspace. Keep this as
  # one update source so concurrent PRs do not compete to rewrite the lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    # Dependabot does not apply this routine-update cooldown to security fixes.
    cooldown:
      default-days: 2
    # Every workspace update rewrites the shared root lockfile. Keep one npm
    # update in flight so Dependabot branches never conflict with each other.
    open-pull-requests-limit: 1
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Module Federation's generated remoteEntry is a private contract with every
      # plugin bundle, so moving the host alone strands installed plugins (they
      # get a null React and are refused by the ABI guard). Upgrade the host, the
      # in-repo plugins, and every external plugin together, bump
      # SERO_PLUGIN_RUNTIME_ABI, and republish — see docs/plugins/technical.md.
      - dependency-name: "@module-federation/*"
    groups:
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"
